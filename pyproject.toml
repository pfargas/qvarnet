[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qvarnet"
version = "0.1.0"
description = "Modular ANNs for VMC scheme"
authors = [{ name = "Pau Fargas", email = "pau.fargas@upc.edu" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core JAX stack
    "jax[cuda12]>=0.7.0",
    "flax>=0.10.0",
    "optax>=0.2.6",
    # Numerics & plotting
    "numpy>=2.0",
    "matplotlib>=3.9",
    # Utilities
    "tqdm>=4.66",
    "msgpack>=1.1",
    "pyyaml>=6.0",
    "pandas>=3.0.3",
    # Sweep/queue infrastructure (the sibling repo; on clusters: pip install -e ~/runq)
    "runq",
    "folx>=0.2.22",
]

[tool.uv.sources]
runq = { path = "../runq", editable = true }

[project.scripts]
qvarnet = "qvarnet.runner:main"

# ---------------------------------------------------------------------------
# Optional extras (pip install qvarnet[docs])
# ---------------------------------------------------------------------------
[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
]

# ---------------------------------------------------------------------------
# Dependency groups — dev-only, not shipped to users (uv sync --group dev)
# ---------------------------------------------------------------------------
[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
lint = [
    "ruff>=0.6",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
    "pillow>=10.0",     # GIF/image saving in notebooks
]

# ---------------------------------------------------------------------------
# Hatchling — src layout
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/qvarnet"]

# ---------------------------------------------------------------------------
# Ruff — linting & formatting
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]   # pycodestyle, pyflakes, isort, pyupgrade
ignore = ["E501"]                 # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
