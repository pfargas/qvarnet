# Harmonic oscillator — 5 particles, 1D, MLP ansatz
# Run: uv run python -m qvarnet.runner experiments/harmonic_oscillator.yaml
# Override: uv run python -m qvarnet.runner experiments/harmonic_oscillator.yaml --set training.n_epochs=2000

name: harmonic_5p_mlp
output_dir: ./outputs/harmonic_5p_mlp/

# ── Physical system ────────────────────────────────────────────────────────
shape:
  n_chains: 1000
  n_particles: 5
  n_dim: 1
  # or specify dof directly: dof: 5

# ── Wavefunction ansatz ────────────────────────────────────────────────────
model:
  type: mlp
  architecture: [5, 64, 64, 1]   # input=dof, hidden layers, output=1 (log|ψ|)

# ── Hamiltonian ────────────────────────────────────────────────────────────
hamiltonian:
  type: harmonic-oscillator
  omega: 1.0
  laplacian_method: forward_ad   # exact; use "hutchinson" for large dof
  # hutchinson_n_terms: 20       # only used when laplacian_method: hutchinson
  # hutchinson_distribution: rademacher

# ── Optimizer ─────────────────────────────────────────────────────────────
optimizer:
  type: adam
  learning_rate: 1e-3

# ── Training ──────────────────────────────────────────────────────────────
training:
  n_epochs: 5000
  rng_seed: 42
  save_checkpoints: true
  warm_walkers: true
  is_update_step_size: true   # auto-tune step_size toward target_acceptance
  target_acceptance: 0.5
  adaptation_rate: 0.1
  # cusp:                     # uncomment to enable cusp condition
  #   alpha: 0.01
  #   epsilon: 1e-2
  #   n: 2.0
  #   C_n: 1.0

# ── MCMC sampler ──────────────────────────────────────────────────────────
sampler:
  step_size: 0.5
  chain_length: 200
  thermalization_steps: 20
  thinning_factor: 1

# ── Coordinate mode ───────────────────────────────────────────────────────
coord_mode:
  type: lab   # "lab" (default) or "jacobi"
  # For jacobi, also specify:
  # n_particles_physical: 5
  # n_dim: 1
